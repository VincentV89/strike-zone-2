<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Strike Zone 2</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        width: 100%; height: 100%;
        overflow: hidden;
        background: #000;
        font-family: system-ui, sans-serif;
        color: #eee;
      }

      #game-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      #ui-container {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* Screens — only .active is visible */
      .screen { display: none; }
      .screen.active { display: flex; align-items: center; justify-content: center; }

      /* Allow pointer events on interactive screens */
      .screen[data-screen="main-menu"],
      .screen[data-screen="end-round"],
      .screen[data-screen="leaderboard"] {
        pointer-events: auto;
        background: rgba(0, 0, 0, 0.75);
        width: 100%; height: 100%;
      }

      /* HUD overlays the canvas — no pointer events */
      .screen[data-screen="hud"] {
        pointer-events: none;
        width: 100%; height: 100%;
        align-items: flex-start;
        justify-content: flex-start;
        display: none;
      }
      .screen[data-screen="hud"].active { display: flex; }

      /* ── Main menu ──────────────────────────────────────── */
      .main-menu__content {
        display: flex; flex-direction: column; align-items: center; gap: 24px;
        padding: 48px; background: rgba(0,0,0,0.6); border-radius: 8px;
      }
      .main-menu__title { font-size: 2.5rem; font-weight: 700; letter-spacing: 0.05em; }
      .main-menu__config { display: flex; flex-direction: column; gap: 12px; min-width: 220px; }
      .config-label { font-size: 0.85rem; text-transform: uppercase; opacity: 0.7; }
      select { padding: 6px 10px; background: #222; color: #eee; border: 1px solid #555; border-radius: 4px; }
      .bot-stepper { display: flex; align-items: center; gap: 12px; }
      .bot-stepper button { width: 32px; height: 32px; background: #333; border: 1px solid #555; color: #eee; border-radius: 4px; cursor: pointer; font-size: 1.1rem; }
      .bot-stepper span { min-width: 20px; text-align: center; font-size: 1.1rem; }

      /* ── Buttons ───────────────────────────────────────── */
      .btn-primary, .btn-secondary {
        padding: 10px 28px; border: none; border-radius: 4px; cursor: pointer;
        font-size: 1rem; font-weight: 600; letter-spacing: 0.03em;
        transition: opacity 0.15s;
      }
      .btn-primary:hover, .btn-secondary:hover { opacity: 0.85; }
      .btn-primary { background: #c0392b; color: #fff; }
      .btn-secondary { background: #555; color: #eee; }
      .btn-primary:disabled, .btn-secondary:disabled { opacity: 0.4; cursor: not-allowed; }
      .btn-primary.loading::after { content: ' …'; }

      /* ── HUD ──────────────────────────────────────────── */
      .hud {
        display: flex; gap: 24px; align-items: center;
        padding: 10px 18px; background: rgba(0,0,0,0.5);
        font-size: 0.95rem; font-weight: 600;
        border-bottom-right-radius: 6px;
      }
      .hud__vitals { display: flex; gap: 6px; align-items: center; }
      .hud__label { font-size: 0.7rem; opacity: 0.6; text-transform: uppercase; }
      .hud__timer { font-size: 1.1rem; font-variant-numeric: tabular-nums; }
      .hud__crosshair {
        position: absolute; top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        font-size: 1.4rem; opacity: 0.8;
        pointer-events: none;
      }

      /* ── End-round ──────────────────────────────────────── */
      .end-round__content {
        display: flex; flex-direction: column; align-items: center; gap: 20px;
        padding: 48px; background: rgba(0,0,0,0.6); border-radius: 8px; min-width: 320px;
      }
      .end-round__score { font-size: 1.1rem; }
      .end-round__submit { display: flex; flex-direction: column; gap: 8px; width: 100%; }
      .end-round__submit label { font-size: 0.85rem; opacity: 0.7; }
      .end-round__submit input {
        padding: 8px 10px; background: #222; color: #eee;
        border: 1px solid #555; border-radius: 4px; font-size: 1rem;
      }
      .end-round__actions { display: flex; gap: 12px; }
      .error-msg { color: #e74c3c; font-size: 0.8rem; }
      .status-msg { font-size: 0.85rem; opacity: 0.8; }

      /* ── Leaderboard ────────────────────────────────────── */
      .leaderboard__content {
        display: flex; flex-direction: column; align-items: center; gap: 20px;
        padding: 48px; background: rgba(0,0,0,0.6); border-radius: 8px; min-width: 400px;
      }
      .leaderboard__table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
      .leaderboard__table th, .leaderboard__table td {
        padding: 8px 12px; text-align: left; border-bottom: 1px solid #333;
      }
      .leaderboard__table th { opacity: 0.6; font-weight: 600; }
    </style>
  </head>
  <body>
    <canvas id="game-canvas"></canvas>
    <div id="ui-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
