name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Quality gate (runs on every push and PR) ───────────────────────────────
  ci:
    name: Lint, test & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # SEC-BUILD-004: lockfile-enforced install — no resolution drift
      - name: Install dependencies (locked)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Test leaderboard-backend package
        run: npm run test --workspace=packages/leaderboard-backend

      - name: Test leaderboard-client package
        run: npm run test --workspace=packages/leaderboard-client

      # SEC-BUILD-001: block on high/critical CVEs before build or deploy
      - name: Dependency vulnerability scan
        run: npm audit --audit-level=high

      - name: Build frontend
        run: npm run build
        env:
          VITE_LEADERBOARD_URL: ${{ secrets.VITE_LEADERBOARD_URL }}

      - name: Upload dist artefact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ── Deploy (runs only on push to main) ────────────────────────────────────
  deploy:
    name: Deploy to Cloudflare
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (locked)
        run: npm ci

      - name: Download dist artefact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Step 1 — Deploy leaderboard backend to staging
      - name: Deploy leaderboard backend → staging
        run: npx wrangler@3 deploy --env staging
        working-directory: packages/leaderboard-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Step 2 — Smoke test staging before promoting to production (SEC-DEPLOY-002)
      - name: Smoke test staging Worker
        run: |
          curl --fail --max-time 10 \
            "https://strike-zone-2-leaderboard-staging.workers.dev/scores"

      # Step 3 — Promote leaderboard backend to production
      - name: Deploy leaderboard backend → production
        run: npx wrangler@3 deploy
        working-directory: packages/leaderboard-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Step 4 — Deploy frontend SPA to Cloudflare Pages production
      - name: Deploy frontend → Cloudflare Pages
        run: npx wrangler@3 pages deploy dist/ --project-name strike-zone-2 --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
