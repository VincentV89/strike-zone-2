name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Quality gate (runs on every push and PR) ───────────────────────────────
  ci:
    name: Lint, test & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # SEC-BUILD-004: lockfile-enforced install — no resolution drift
      - name: Install dependencies (locked)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Test leaderboard-backend package
        run: npm run test --workspace=packages/leaderboard-backend

      - name: Test leaderboard-client package
        run: npm run test --workspace=packages/leaderboard-client

      # SEC-BUILD-001: block on high/critical CVEs before build or deploy
      - name: Dependency vulnerability scan
        run: npm audit --audit-level=high

      - name: Build frontend
        run: npm run build
        env:
          VITE_LEADERBOARD_URL: ${{ secrets.VITE_LEADERBOARD_URL }}

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

      # Bundle leaderboard-backend as a Lambda deployment package (CJS, single file)
      - name: Bundle leaderboard-backend for Lambda
        run: |
          npx esbuild packages/leaderboard-backend/src/index.ts \
            --bundle \
            --platform=node \
            --target=node20 \
            --format=cjs \
            --outfile=packages/leaderboard-backend/.lambda/index.js
          cd packages/leaderboard-backend/.lambda && zip -r ../leaderboard-backend.zip index.js

      - name: Upload leaderboard-backend Lambda package
        uses: actions/upload-artifact@v4
        with:
          name: leaderboard-backend-lambda
          path: packages/leaderboard-backend/leaderboard-backend.zip
          retention-days: 1

  # ── Deploy (runs only on push to main) ────────────────────────────────────
  deploy:
    name: Deploy to AWS
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Download leaderboard-backend Lambda package
        uses: actions/download-artifact@v4
        with:
          name: leaderboard-backend-lambda
          path: lambda/

      # Step 1 — Deploy leaderboard backend to staging Lambda
      - name: Deploy leaderboard-backend → staging Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ secrets.LAMBDA_FUNCTION_STAGING }} \
            --zip-file fileb://lambda/leaderboard-backend.zip

      # Step 2 — Smoke test staging before promoting to production (SEC-DEPLOY-002)
      - name: Smoke test staging Lambda
        run: |
          curl --fail --max-time 10 \
            "${{ secrets.LEADERBOARD_STAGING_URL }}/scores"

      # Step 3 — Promote leaderboard backend to production Lambda
      - name: Deploy leaderboard-backend → production Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ secrets.LAMBDA_FUNCTION_PROD }} \
            --zip-file fileb://lambda/leaderboard-backend.zip

      # Step 4a — Deploy hashed frontend assets with long-lived cache
      - name: Deploy frontend assets → S3 (immutable cache)
        run: |
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET_NAME }} \
            --delete \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable"

      # Step 4b — Deploy index.html with no-cache so deploys are instant
      - name: Deploy index.html → S3 (no-cache)
        run: |
          aws s3 cp dist/index.html s3://${{ secrets.S3_BUCKET_NAME }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      # Step 5 — Invalidate CloudFront so new index.html is served immediately
      - name: Invalidate CloudFront distribution
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
